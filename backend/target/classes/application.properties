# ==============================
# NSP-4-S2-S25App Configuration
# ==============================

server.port=8080
spring.application.name=nsp-4-s2-s25app

# ==============================
# Hugging Face API Configuration
# ==============================
# IMPORTANT: Replace with your actual Hugging Face token
# Get it from: https://huggingface.co/settings/tokens
huggingface.api.token=hf_YOUR_TOKEN_HERE

# LLM Model to use (free tier models)
# Options:
#   google/flan-t5-large      → Good for Q&A (recommended)
#   facebook/blenderbot-400M-distill → Conversational
#   deepset/roberta-base-squad2  → Extractive Q&A
huggingface.api.model=google/flan-t5-large

huggingface.api.base-url=https://api-inference.huggingface.co/models

# ==============================
# Logging
# ==============================
logging.level.com.nsp.app=INFO
logging.level.org.springframework.web=WARN

# ==============================
# Jackson
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false
